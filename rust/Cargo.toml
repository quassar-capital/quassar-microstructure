[package]
name = "quassar-microstructure-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Proprietary"
description = "Research-oriented stochastic microstructure kernels for Quassar Capital"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", features = [] }
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"

[profile.release]
overflow-checks = true
