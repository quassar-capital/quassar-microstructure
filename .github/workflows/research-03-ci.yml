
name: Research 03 Latency-Constrained Execution CI

on:
  push:
    branches:
      - research-03-latency-constrained-price-discovery
      - main
  pull_request:
    branches:
      - main

jobs:
  scientific-validation:
    name: Causal Execution and Liquidity Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Validate Research 03 analytical references
        run: |
          python -m pytest -q research_03/tests/test_latency_execution.py
