
name: Microstructure CI

on:
  push:
    branches:
      - main
      - feature/microstructure-research-v1
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python and Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest numpy

      - name: Build and install Python-Rust package
        run: |
          python -m pip install .

      - name: Run Python tests
        run: |
          python -m pytest -q

      - name: Run Rust tests
        run: |
          cd rust
          cargo test
