[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "quassar-microstructure"
version = "0.1.0"
description = "Research-grade building blocks for stochastic market microstructure"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "maturin>=1.7,<2"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "quassar_microstructure._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
