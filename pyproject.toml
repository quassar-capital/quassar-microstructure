
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "quassar-microstructure"
version = "0.1.0"
description = "Scientific research in stochastic market microstructure"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "quassar_microstructure._core"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
